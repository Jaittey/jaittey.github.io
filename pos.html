<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>POS System | Small Business</title>
<link rel="icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/themes.css"><link rel="stylesheet" href="assets/css/print.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/theme.js"></script><script src="assets/js/ui.js"></script>
<script defer src="assets/js/pos.js"></script>
</head><body data-page="pos" data-section="Sales & POS Dashboard"><div class="app"><main class="main"><div class="content"><section class="hero"><div><p class="kicker">SALES & POS</p><h1>Point of Sale</h1><p>Fast checkout with inventory deduction and paid invoice creation.</p></div><div class="hero-side"><small>Current Sale</small><strong id="saleTotalHeader">MVR 0.00</strong></div></section>
<section class="pos-layout"><div class="panel"><div class="panel-head"><div><p class="kicker">Products</p><h2>Select Items</h2></div><div class="search" style="max-width:310px"><input id="productSearch" placeholder="Search name or scan SKU"></div></div><div id="productGrid" class="product-grid"></div></div>
<aside class="panel"><p class="kicker">Checkout</p><h2>Cart</h2><div id="cartList" class="cart-list"></div><div class="form-grid" style="margin-top:15px"><label class="wide"><span>Customer</span><select id="posCustomer"></select></label><label><span>Discount %</span><input id="discount" type="number" value="0" min="0" max="100"></label><label><span>GST %</span><input id="gst" type="number" value="0" min="0"></label><label class="wide"><span>Payment Method</span><select id="paymentMethod"><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Other</option></select></label></div><div class="total-box"><div class="total-row"><span>Subtotal</span><b id="subtotal">MVR 0.00</b></div><div class="total-row"><span>Discount</span><b id="discountValue">MVR 0.00</b></div><div class="total-row"><span>GST</span><b id="taxValue">MVR 0.00</b></div><div class="total-row grand"><span>Total</span><b id="grandTotal">MVR 0.00</b></div></div><button class="btn btn-primary" id="completeSale" style="width:100%;margin-top:12px">Complete Sale</button></aside></section>
<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>Latest Checkouts</h2></div><div class="table-wrap responsive-table"><table id="recentPos"><thead><tr><th>Sale</th><th>Customer</th><th>Payment</th><th>Status</th><th>Total</th></tr></thead><tbody></tbody></table></div></section></div></main></div><script defer src="assets/js/shell.js"></script><script src="assets/js/pwa.js"></script></body></html>
